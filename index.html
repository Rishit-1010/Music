<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rishit's Stereo</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Rubik:wght@300;400;500;600&family=Space+Mono:wght@400;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icon sprite (Lucide-style) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
  <symbol id="i-volume-x" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></symbol>
  <symbol id="i-skip-back" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></symbol>
  <symbol id="i-skip-forward" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></symbol>
  <symbol id="i-rewind" viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></symbol>
  <symbol id="i-fast-forward" viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></symbol>
  <symbol id="i-circle-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</svg>

<div class="app" id="app" data-mode="list">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <a class="brand" href="./" aria-label="Rishit's Stereo">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="18"/>
        <g transform="translate(9.5 9.5) scale(.87)"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></g>
      </svg>
      <span class="brand-text"><span class="brand-name">Rishit's</span><span class="brand-sub">Stereo</span></span>
    </a>

    <p class="side-label">YOUR LIBRARY</p>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="all" title="All Tracks"><svg class="ic"><use href="#i-music"/></svg><span>All Tracks</span></button>
      <button class="nav-item" data-view="phonk" title="Phonk"><svg class="ic"><use href="#i-circle-play"/></svg><span>Phonk</span></button>
      <button class="nav-item" data-view="english" title="English &amp; Other"><svg class="ic"><use href="#i-circle-play"/></svg><span>English &amp; Other</span></button>
      <button class="nav-item" data-view="hindi" title="Hindi/Gujarati"><svg class="ic"><use href="#i-circle-play"/></svg><span>Hindi/Gujarati</span></button>
      <button class="nav-item" data-view="instrumental" title="Instrumental"><svg class="ic"><use href="#i-circle-play"/></svg><span>Instrumental</span></button>
      <button class="nav-item" data-view="devotional" title="Devotional"><svg class="ic"><use href="#i-circle-play"/></svg><span>Devotional</span></button>
      <button class="nav-item" data-view="recent" title="Recently Played"><svg class="ic"><use href="#i-circle-play"/></svg><span>Recently Played</span></button>
      <button class="nav-item" data-view="liked" title="Liked Songs"><svg class="ic"><use href="#i-heart"/></svg><span>Liked Songs</span></button>
      <button class="nav-item" data-view="now" title="Now Playing"><svg class="ic"><use href="#i-play"/></svg><span>Now Playing</span></button>
    </nav>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">

    <header class="topbar">
      <label class="search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="searchInput" type="text" placeholder="Search your library…" autocomplete="off" spellcheck="false" aria-label="Search your library">
      </label>
      <div class="avatar" aria-hidden="true">RM</div>
    </header>

    <main class="scroll" id="scroll">

      <!-- Track list (All Tracks / categories / recent / liked / search) -->
      <section class="list-view" id="listView">
        <header class="list-head">
          <p class="eyebrow" id="viewEyebrow">Collection</p>
          <h1 id="viewTitle">All Tracks</h1>
        </header>
        <ul class="tracklist" id="trackList"></ul>
        <div class="empty" id="emptyState" hidden>
          <svg class="ic"><use href="#i-music"/></svg>
          <h2 id="emptyTitle"></h2>
          <p id="emptyText"></p>
        </div>
      </section>

      <!-- Now Playing -->
      <section class="now" id="nowView" hidden>
        <div class="now-head">
          <button class="icon-btn" data-act="back" aria-label="Back"><svg class="ic"><use href="#i-chevron-left"/></svg></button>
          <p class="eyebrow center">Now Playing</p>
          <div class="now-actions">
            <button class="icon-btn" data-act="share" aria-label="Share"><svg class="ic"><use href="#i-share"/></svg></button>
            <button class="icon-btn" data-act="like" aria-label="Like" aria-pressed="false"><svg class="ic"><use href="#i-heart"/></svg></button>
          </div>
        </div>

        <div class="now-body">
          <div class="cover big-cover js-cover"></div>

          <div class="now-info">
            <p class="eyebrow">Listening Now</p>
            <h2 class="now-title js-title"></h2>
            <p class="now-cat js-cat"></p>

            <div class="now-progress">
              <input class="rng js-progress" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
              <div class="times"><span class="js-cur">0:00</span><span class="js-dur">0:00</span></div>
            </div>

            <div class="now-controls">
              <button class="ctl" data-act="prev" aria-label="Previous"><svg class="ic"><use href="#i-skip-back"/></svg></button>
              <button class="ctl" data-act="rew" aria-label="Back 10 seconds"><svg class="ic"><use href="#i-rewind"/></svg></button>
              <button class="play-big" data-act="toggle" aria-label="Play / Pause"><svg class="ic solid"><use href="#i-play"/></svg></button>
              <button class="ctl" data-act="ff" aria-label="Forward 10 seconds"><svg class="ic"><use href="#i-fast-forward"/></svg></button>
              <button class="ctl" data-act="next" aria-label="Next"><svg class="ic"><use href="#i-skip-forward"/></svg></button>
            </div>

            <div class="now-extra">
              <div class="vol">
                <button class="ctl mute" data-act="mute" aria-label="Mute"><svg class="ic"><use href="#i-volume"/></svg></button>
                <input class="rng js-volume" type="range" min="0" max="100" step="1" value="80" aria-label="Volume">
              </div>
              <div class="extra-right">
                <button class="ctl mute" data-act="repeat" aria-label="Repeat" aria-pressed="false"><svg class="ic"><use href="#i-repeat"/></svg></button>
                <button class="ctl mute" data-act="sleep" aria-label="Sleep timer"><svg class="ic"><use href="#i-clock"/></svg></button>
              </div>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- ============ BOTTOM PLAYER ============ -->
    <footer class="player" id="player">
      <div class="pl-left">
        <button class="cover pl-cover js-cover" data-act="expand" aria-label="Open Now Playing"></button>
        <div class="pl-meta">
          <p class="pl-title js-title"></p>
          <p class="pl-cat js-cat"></p>
        </div>
      </div>

      <div class="pl-center">
        <div class="pl-controls">
          <button class="ctl" data-act="prev" aria-label="Previous"><svg class="ic"><use href="#i-skip-back"/></svg></button>
          <button class="ctl" data-act="rew" aria-label="Back 10 seconds"><svg class="ic"><use href="#i-rewind"/></svg></button>
          <button class="play-big" data-act="toggle" aria-label="Play / Pause"><svg class="ic solid"><use href="#i-play"/></svg></button>
          <button class="ctl" data-act="ff" aria-label="Forward 10 seconds"><svg class="ic"><use href="#i-fast-forward"/></svg></button>
          <button class="ctl" data-act="next" aria-label="Next"><svg class="ic"><use href="#i-skip-forward"/></svg></button>
        </div>
        <div class="pl-progress">
          <span class="js-cur">0:00</span>
          <input class="rng js-progress" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
          <span class="js-dur">0:00</span>
        </div>
      </div>

      <div class="pl-right">
        <button class="ctl mute" data-act="repeat" aria-label="Repeat" aria-pressed="false"><svg class="ic"><use href="#i-repeat"/></svg></button>
        <button class="ctl mute" data-act="sleep" aria-label="Sleep timer"><svg class="ic"><use href="#i-clock"/></svg></button>
        <div class="vol">
          <button class="ctl mute" data-act="mute" aria-label="Mute"><svg class="ic"><use href="#i-volume"/></svg></button>
          <input class="rng js-volume" type="range" min="0" max="100" step="1" value="80" aria-label="Volume">
        </div>
        <button class="ctl mute" data-act="expand" aria-label="Open Now Playing"><svg class="ic"><use href="#i-expand"/></svg></button>
      </div>
    </footer>
  </div>
</div>

<!-- ============ SLEEP TIMER ============ -->
<div class="modal" id="sleepModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="sleep-card" role="dialog" aria-modal="true" aria-labelledby="sleepTitle">
    <button class="icon-btn close" data-close aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>

    <p class="eyebrow">Sleep Timer</p>
    <h2 id="sleepTitle">Stop the music after…</h2>

    <div class="sleep-status" id="sleepStatus" hidden>
      <div>
        <span class="mini">Music stops in</span>
        <strong id="sleepRemain">0:00:00</strong>
      </div>
      <button class="btn-ghost" id="sleepCancel">Cancel timer</button>
    </div>

    <div class="sleep-options">
      <button class="sleep-opt" data-min="60"><span class="n">1</span><span class="u">hour</span></button>
      <button class="sleep-opt" data-min="120"><span class="n">2</span><span class="u">hours</span></button>
      <button class="sleep-opt" data-min="180"><span class="n">3</span><span class="u">hours</span></button>
      <button class="sleep-opt" data-min="300"><span class="n">5</span><span class="u">hours</span></button>
    </div>

    <div class="sleep-custom">
      <p class="eyebrow">Custom time</p>
      <div class="custom-row">
        <label class="field"><input id="cHours" type="number" inputmode="numeric" min="0" max="24" placeholder="0"><span>hr</span></label>
        <label class="field"><input id="cMins" type="number" inputmode="numeric" min="0" max="999" placeholder="0"><span>min</span></label>
        <button class="btn-lime" id="sleepSet">Start</button>
      </div>
      <p class="hint" id="sleepError" aria-live="polite"></p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<audio id="audio" preload="metadata"></audio>

<script src="tracks.js"></script>
<script src="script.js"></script>
</body>
</html>
